# ============================================
# Egg 赛事竞猜 — 生产环境配置
# 启动方式: java -jar egg-esports.jar --spring.profiles.active=prod
# ============================================

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/egg_esports?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  data:
    redis:
      # 生产环境 Redis 配置（显式覆盖 application.yml，避免继承 127.0.0.1 与弱口令 123456）
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}             # 必填，无默认值
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl  # 生产环境关闭 SQL 日志

# JWT
jwt:
  secret: ${JWT_SECRET}                      # 必填，无默认值
  expiration: ${JWT_EXPIRATION:604800000}     # 7天

# 业务配置
egg:
  bet:
    init-points: ${EGG_INIT_POINTS:1000}
    win-multiplier: ${EGG_WIN_MULTIPLIER:2}
  sync:
    enabled: ${EGG_SYNC_ENABLED:true}
  cors:
    allowed-origins: ${EGG_CORS_ORIGINS}      # 必填，逗号分隔，如 https://egg.example.com
  upload:
    path: ${EGG_UPLOAD_PATH:/data/uploads}     # 生产环境使用绝对路径
  http:
    # 生产环境：不走 Clash 代理，直连外网 API（置空覆盖 application.yml 的 127.0.0.1:7897 默认值）
    proxy-host:
    proxy-port:
  grid:
    api-key: ${GRID_API_KEY}                        # 生产环境必填，无默认值
    central-data-url: https://api-op.grid.gg/central-data/graphql
  riot:
    api-key: ${RIOT_API_KEY}
    base-url: https://esports-api.service.valorantesports.com/persisted/val/getSchedule
    leagues:
      - id: 111691194187846945
        name: VCT CN
      - id: 109940824119741550
        name: Masters
      - id: 107254585505459304
        name: Champions
      - id: 109974795266458277
        name: VCT Americas
      - id: 106109559530232966
        name: VCT EMEA
      - id: 109974804058058602
        name: VCT Pacific
