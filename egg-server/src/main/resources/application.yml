server:
  port: 8088

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/egg_esports?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: admin
    password: admin123
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT
jwt:
  secret: REDACTED-JWT-SECRET
  expiration: 604800000  # 7 days in ms

# 押注配置
egg:
  bet:
    init-points: 1000   # 新用户初始积分
    win-multiplier: 2   # 猜中返还倍数
  sync:
    enabled: true          # 是否启用定时同步
  riot:
    api-key: ${RIOT_API_KEY}
    base-url: https://esports-api.service.valorantesports.com/persisted/val/getSchedule
    leagues:
      - id: 111691194187846945
        name: VCT CN
      - id: 109940824119741550
        name: Masters
      - id: 107254585505459304
        name: Champions
      - id: 109974795266458277
        name: VCT Americas
      - id: 106109559530232966
        name: VCT EMEA
      - id: 109974804058058602
        name: VCT Pacific
