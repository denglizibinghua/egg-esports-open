# ============================================
# Egg 赛事竞猜 — Nginx 生产环境配置
# 适用: Ubuntu 20.04+ / CentOS 7+ with nginx 1.18+
# 路径: /etc/nginx/sites-available/egg-esports
# ============================================

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name egg.your-domain.com;

    # 同时处理不带 www 的域名
    if ($host = egg.your-domain.com) {
        return 301 https://$host$request_uri;
    }

    return 404;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name egg.your-domain.com;

    # ==================== SSL 证书 ====================
    # 方式1: Let's Encrypt 免费证书（推荐）
    #   sudo apt install certbot python3-certbot-nginx
    #   sudo certbot --nginx -d egg.your-domain.com
    #
    # 方式2: 自签名证书（仅测试用）
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/ssl/private/egg.key \
    #     -out /etc/ssl/certs/egg.crt

    ssl_certificate     /etc/ssl/certs/egg.crt;
    ssl_certificate_key /etc/ssl/private/egg.key;

    # SSL 安全配置（Mozilla Intermediate）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==================== Gzip 压缩 ====================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # ==================== 静态文件（头像上传） ====================
    # Spring Boot 不再直接暴露 uploads 目录，由 nginx 高性能处理
    location /uploads/ {
        alias /data/egg-esports/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ==================== 前端静态资源 ====================
    # 假设 egg-web 构建产物部署在 /var/www/egg-esports/
    location / {
        root /var/www/egg-esports;
        try_files $uri $uri/ /index.html;
        expires 7d;
    }

    # 前端静态资源长缓存（带 hash 的文件名）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/egg-esports;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ==================== API 反向代理 ====================
    location /api/ {
        # Spring Boot 后端（默认 8088 端口）
        proxy_pass http://127.0.0.1:8088;

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ==================== 限流 ====================
    # nginx 层额外限流（与后端 @RateLimit 形成双层防护）
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    location /api/user/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/bet/place {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== 日志 ====================
    access_log /var/log/nginx/egg-esports.access.log;
    error_log  /var/log/nginx/egg-esports.error.log;
}
