name: CI

on: [push, pull_request]

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Maven Compile
        working-directory: egg-server
        run: mvn compile -B -q
      - name: Maven Test
        working-directory: egg-server
        run: mvn test -B

  frontend:
    name: Frontend (npm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: egg-web/package-lock.json
      - name: Install dependencies
        working-directory: egg-web
        run: npm ci
      - name: Build
        working-directory: egg-web
        run: npm run build
      - name: Lint
        working-directory: egg-web
        run: npm run lint